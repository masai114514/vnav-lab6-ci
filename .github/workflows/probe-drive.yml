name: probe-drive

# 临时探针：验证 GitHub Actions 的 runner 能不能取到老师给的数据集，并报告总大小。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Google Drive dataset link
        run: |
          ID=1TohOnfjR_FKf_y9wYTEkmv-XCuFPFRPt
          URL="https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t"
          echo "== headers (range 0-0) =="
          curl -sSL -D /tmp/h -o /dev/null -r 0-0 --max-time 60 "$URL" || echo "curl rc=$?"
          grep -iE "^(HTTP/|content-range|content-length|content-type|content-disposition)" /tmp/h || true
          echo "== 全长下载 =="
          /usr/bin/time -f "耗时 %es" curl -sSL -o /tmp/ds.zip --max-time 900 "$URL" || echo "curl rc=$?"
          ls -l /tmp/ds.zip
          du -h /tmp/ds.zip
          echo "== zip 结构 =="
          unzip -l /tmp/ds.zip | head -20
          echo "== 顶层目录 =="
          unzip -l /tmp/ds.zip | awk 'NR>3 {print $4}' | grep -v '^$' | cut -d/ -f1 | sort -u | head

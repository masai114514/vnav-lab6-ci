name: probe-drive

# 临时探针：Drive 返回的 2040 字节 HTML 到底要什么（打印出来 + 试 uuid 流程）。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Decode the confirm page
        run: |
          python3 - <<'PY'
          import urllib.request, re
          ID = "1TohOnfjR_FKf_y9wYTEkmv-XCuFPFRPt"
          BASE = "https://drive.usercontent.google.com/download?id=%s&export=download&confirm=t" % ID

          def get(url, hdrs=None):
              req = urllib.request.Request(url, headers=hdrs or {})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return r.status, dict(r.headers), r.read()

          st, hd, body = get(BASE)
          print("=== 第一次响应 ===", st, hd.get("Content-Type"), len(body))
          print(body.decode("utf-8", "replace")[:1200])
          print("=== 找 uuid / confirm ===")
          txt = body.decode("utf-8", "replace")
          for pat in (r'name="uuid" value="([^"]*)"', r'value="([^"]*)"\s+name="uuid"', r'uuid=([0-9a-f-]{20,})'):
              m = re.search(pat, txt)
              print(pat, "->", m.group(1) if m else None)
          print("=== 带 uuid 再试 1 MB Range ===")
          m = re.search(r'name="uuid" value="([^"]*)"', txt) or re.search(r'uuid=([0-9a-f-]{20,})', txt)
          if m:
              u = "%s&uuid=%s" % (BASE, m.group(1))
              try:
                  st2, hd2, b2 = get(u, {"Range": "bytes=0-1048575"})
                  print("status", st2, "type", hd2.get("Content-Type"), "len", len(b2), "head", b2[:8])
              except Exception as e:
                  print("ERR", e)
          PY

name: probe-drive

# 临时探针：不下载 8GB 整包，只用 HTTP Range 读 zip 中央目录 + metadata.yaml。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect remote zip via range requests
        run: |
          df -h / | tail -1
          sed 's/^          //' > /tmp/p.py <<'PY'
          import struct, urllib.request, zlib
          ID = "1TohOnfjR_FKf_y9wYTEkmv-XCuFPFRPt"
          TOTAL = 8574812697
          URL = "https://drive.usercontent.google.com/download?id=%s&export=download&confirm=t" % ID

          def rng(a, b):
              req = urllib.request.Request(URL, headers={"Range": "bytes=%d-%d" % (a, b)})
              with urllib.request.urlopen(req, timeout=180) as r:
                  return r.read()

          tail = rng(TOTAL - 262144, TOTAL - 1)
          i = tail.rfind(b"PK\x05\x06")
          n_total, cdsize, cdoff = struct.unpack("<HII", tail[i + 10:i + 20])
          if n_total == 0xFFFF or cdsize == 0xFFFFFFFF or cdoff == 0xFFFFFFFF:
              j = tail.rfind(b"PK\x06\x06")
              _, _z, _a, _b, _c, _d, _e, n_total, cdsize, cdoff = struct.unpack("<IQHHIIQQQQ", tail[j:j + 56])
          print("entries=%d cdsize=%d cdoff=%d" % (n_total, cdsize, cdoff))
          cd = rng(cdoff, cdoff + cdsize - 1)
          o = 0
          ent = []
          while o < len(cd) and cd[o:o + 4] == b"PK\x01\x02":
              (_s, _v1, _v2, _fl, method, _t, _d, _crc, csize, usize, fnl, efl, fcl, _dn, _ia, _ea, off) = \
                  struct.unpack("<IHHHHHHIIIHHHHHII", cd[o:o + 46])
              name = cd[o + 46:o + 46 + fnl].decode("utf-8", "replace")
              extra = cd[o + 46 + fnl:o + 46 + fnl + efl]
              if csize == 0xFFFFFFFF or usize == 0xFFFFFFFF or off == 0xFFFFFFFF:
                  e = 0
                  while e < len(extra):
                      hid, hsz = struct.unpack("<HH", extra[e:e + 4])
                      if hid == 1:
                          body = extra[e + 4:e + 4 + hsz]
                          k = 0
                          if usize == 0xFFFFFFFF:
                              usize = struct.unpack("<Q", body[k:k + 8])[0]; k += 8
                          if csize == 0xFFFFFFFF:
                              csize = struct.unpack("<Q", body[k:k + 8])[0]; k += 8
                          if off == 0xFFFFFFFF:
                              off = struct.unpack("<Q", body[k:k + 8])[0]; k += 8
                          break
                      e += 4 + hsz
              ent.append((name, usize, csize, method, off))
              o += 46 + fnl + efl + fcl
          print("parsed=%d" % len(ent))
          for n, u, c, m, off in ent[:40]:
              print("  %9.1f MB  method=%d  off=%d  %s" % (u / 1e6, m, off, n))
          big = [e for e in ent if not e[0].endswith("/")]
          if big:
              mx = max(big, key=lambda x: x[1])
              print("max file: %s  %.2f GB" % (mx[0], mx[1] / 1e9))
          tgt = [e for e in ent if e[0].endswith("metadata.yaml")]
          if tgt:
              n, u, c, m, off = tgt[0]
              b = rng(off, off + 200)
              fnl, efl = struct.unpack("<HH", b[26:30])
              ds = off + 30 + fnl + efl
              raw = rng(ds, ds + c - 1)
              txt = zlib.decompress(raw, -15) if m == 8 else raw
              print("==== metadata.yaml (%s) ====" % n)
              print(txt.decode("utf-8", "replace")[:2500])
          else:
              print("no metadata.yaml; names:")
              for e in ent[:25]:
                  print("   ", e[0])
          PY
          head -3 /tmp/p.py
          python3 /tmp/p.py

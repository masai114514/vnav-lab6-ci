name: probe-drive

# 临时探针：两个 Drive 链接各自是"配额超限"还是真能下。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe both links
        run: |
          python3 - <<'PY'
          import urllib.request, re

          def probe(name, fid):
              url = "https://drive.usercontent.google.com/download?id=%s&export=download&confirm=t" % fid
              req = urllib.request.Request(url, headers={"Range": "bytes=0-1048575"})
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      body = r.read()
                      ct = r.headers.get("Content-Type")
                      cr = r.headers.get("Content-Range")
                      if ct and "html" in ct:
                          t = body.decode("utf-8", "replace")
                          title = re.search(r"<title>([^<]*)</title>", t)
                          print("%-10s -> HTML: %s (%d bytes)" % (name, title.group(1) if title else "?", len(body)))
                      else:
                          print("%-10s -> OK  type=%s range=%s len=%d head=%s" % (name, ct, cr, len(body), body[:8]))
              except Exception as e:
                  print("%-10s -> ERR %s" % (name, str(e)[:80]))

          probe("2024新", "1TohOnfjR_FKf_y9wYTEkmv-XCuFPFRPt")   # 老师这次给的 vnav-lab6-office
          probe("2023旧", "1S9pqqIx43_NcL9RBmbr5JfMS17QfkDkW")   # 2023 版 page 的 office.bag
          PY

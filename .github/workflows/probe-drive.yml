name: probe-drive

# 临时探针：测 Drive 的 Range 上限（多大区间会退化成 HTML 提示页）。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Probe range sizes
        run: |
          python3 - <<'PY'
          import urllib.request, time
          ID = "1TohOnfjR_FKf_y9wYTEkmv-XCuFPFRPt"
          URL = "https://drive.usercontent.google.com/download?id=%s&export=download&confirm=t" % ID

          def probe(a, b):
              req = urllib.request.Request(URL, headers={"Range": "bytes=%d-%d" % (a, b)})
              t0 = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=300) as r:
                      data = r.read()
                      return r.status, r.headers.get("Content-Type"), len(data), round(time.time() - t0, 1)
              except Exception as e:
                  return "ERR", str(e)[:60], 0, round(time.time() - t0, 1)

          MB = 1024 * 1024
          for mb in (1, 8, 32, 64, 128, 256):
              a = 0
              b = mb * MB - 1
              print("offset=0  size=%-4d MB -> %s" % (mb, probe(a, b)))
          print("--- 非零起点，1 MB ---")
          for off_mb in (1024, 4096, 8192):
              a = off_mb * MB
              print("offset=%-5d MB size=1 MB -> %s" % (off_mb, probe(a, a + MB - 1)))
          PY

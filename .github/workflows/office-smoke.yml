name: office-smoke

# =============================================================================
# 官方 office 数据集：取数据 → melodic 容器里跑 240 帧 × 四个估计器
# 四个 job 并行（matrix estimator: 0/1/2/3），各自下载 bag、各自编译；
# artifact 名带估计器编号，避免四个 job 上传同名产物互相覆盖。
#
# 数据从哪来：
#   官方链接（Google Drive，1TohOnfjR_FKf_y9wYTEkmv-XCuFPFRPt）在这个网络里取不到，
#   且全班同时下载会触发 "Google Drive - Quota exceeded"（HTTP 200 + 2040 字节 HTML）。
#   老师给的包最终通过 QQ 闪传拿到，md5 3c825b6376836bf0300ed0ad36777657 校验通过。
#
#   整包 8.57 GB，解压出 20.4 GB 的 db3，没必要整包搬进 CI。这里用的是
#   release 资产 lab6-office-data/office15.bag：
#     · 源包连续前 15 秒（timestamp 24000000000 → 38994999999 ns）
#     · 已用 rosbags 0.11.9 转成 ROS1 bag，7685 条消息 / 277 帧图像
#     · 只保留 /tesse/odom、两路图像、两个 camera_info、/tf、/clock
#   裁剪脚本见 ci/trim_db3.py（sqlite 层搬运，不碰消息格式）。
#
# 为什么不能在本地用 ROS1 类型反序列化原 db3：
#   原包是 ROS2 录的，Header.stamp 是 builtin_interfaces/Time；用 ROS1_NOETIC
#   typestore 解析会在 offset 12 报 "Invalid string length"。必须让 rosbags-convert
#   用源端的 typestore 转换，所以裁剪放在 sqlite 层做。
#
# 参数为什么不用覆盖：
#   bag 里 camera_info 实测 K = [415.6922, 0, 360; 0, 415.6922, 240]，
#   图像 720x480（中心正好 360/240），无畸变，深度 32FC1（单位米）——
#   与 pose_estimation.cpp 的默认值一致，也与 depthToMeters() 的 CV_32F 分支一致。
# =============================================================================
on:
  workflow_dispatch:
    inputs:
      max_frames:
        description: '最多处理多少帧'
        required: false
        default: '240'
      rate:
        description: 'rosbag play 速率'
        required: false
        default: '0.2'

env:
  ROS_IMAGE: ros:melodic-ros-base
  BAG_URL: https://github.com/masai114514/vnav-lab6-ci/releases/download/lab6-office-data/office15.bag
  BAG_BYTES: '673442535'

permissions:
  contents: read

jobs:
  smoke:
    name: est${{ matrix.estimator }} → 跑 240 帧
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        estimator: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      # OpenCV 3.4.2 + nonfree 编译要 20 多分钟，和 lab6-ci 共用同一个缓存
      - name: 恢复 OpenCV 依赖缓存
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ws_deps/install
          key: deps-melodic-nonfree-v1-${{ hashFiles('bundle/dependencies/opencv3_catkin/CMakeLists.txt') }}
          restore-keys: |
            deps-melodic-nonfree-v1-

      - name: 环境与磁盘
        shell: bash
        run: |
          echo "deps 缓存 = ${{ steps.deps-cache.outputs.cache-hit }}"
          echo "vCPU = $(nproc)  内存 = $(free -m | awk '/Mem:/{print $2}') MB"
          df -h .

      - name: 下载裁剪后的 bag（release 资产）
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p data
          curl -fL --retry 4 --retry-all-errors --retry-delay 3 \
               -o data/office15.bag "$BAG_URL"
          got=$(stat -c%s data/office15.bag)
          echo "下载 = $got 字节（期望 $BAG_BYTES）"
          [ "$got" = "$BAG_BYTES" ] || { echo "::error::bag 大小不符"; exit 1; }
          file data/office15.bag
          df -h .

      - name: 跑节点（melodic 容器）
        shell: bash
        timeout-minutes: 60
        run: |
          set -o pipefail
          mkdir -p out
          set +e
          docker run --rm --user root \
            -v "$PWD":"$PWD" -w "$PWD" \
            "$ROS_IMAGE" \
            bash ci/office_run.sh data/office15.bag "${{ matrix.estimator }}" "${{ inputs.max_frames }}" "${{ inputs.rate }}" 15
          rc=$?
          set -e
          sudo chown -R "$(id -u):$(id -g)" out ws_main data 2>/dev/null || true
          echo "office_run.sh 退出码 = $rc"
          exit $rc

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-smoke-est${{ matrix.estimator }}
          path: |
            out/*.csv
            out/*.log
          retention-days: 14
          if-no-files-found: warn

      - name: 摘要
        if: always()
        shell: bash
        run: |
          {
            E=${{ matrix.estimator }}
            echo "## 官方 office 数据集 · estimator $E"
            echo
            echo "- 依赖缓存：\`${{ steps.deps-cache.outputs.cache-hit }}\`"
            echo "- 数据：release 资产 \`lab6-office-data/office15.bag\`（前 15 秒，277 帧）"
            echo
            if [ -f "out/office_est${E}.csv" ]; then
              echo "### CSV 前 5 行"
              echo '```'
              head -5 "out/office_est${E}.csv"
              echo '```'
              lines=$(wc -l < "out/office_est${E}.csv")
              echo "行数 = $lines"
            else
              echo "_没有 out/office_est${E}.csv_"
            fi
            echo
            echo "### 节点日志末尾"
            echo '```'
            tail -20 "out/office_node_est${E}.log" 2>/dev/null || echo "(无)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
